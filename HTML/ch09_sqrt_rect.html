<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>√nの長方形</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 上に横 √n・縦 1 の長方形と、切り取った正方形。下に連分数の項と近似分数の表（x² − n y² が ±1 の行に印） */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --ink:#1d2622; --muted:#5d6a63; --rule:#c9d0ca;
  --c0:#1f5fa8; --c1:#b0452a; --c2:#3d7d4f; --glow:#f0c53a; --cell:#ffffff;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --rule:#34403a;
  --c0:#6fa8ec; --c1:#ec8a6c; --c2:#7cc490; --glow:#f0c53a; --cell:#232c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --rule:#34403a;
  --c0:#6fa8ec; --c1:#ec8a6c; --c2:#7cc490; --glow:#f0c53a; --cell:#232c27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;text-wrap:balance;letter-spacing:.02em}
.lead{margin:4px 0 0;color:var(--muted);line-height:1.7;max-width:64ch}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
canvas{width:100%;height:auto;max-width:100%}
.cf{font-family:var(--mono);font-size:1.25rem;font-weight:600}
.cf span.k{color:var(--muted);font-weight:400}
.cf span.now{background:var(--glow);color:#1d2622;border-radius:4px;padding:0 4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:4px 12px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-family:var(--body);font-weight:700;color:var(--muted);font-size:.8rem}
tr.one td{background:var(--glow);color:#1d2622;font-weight:600}
.controls,.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-family:var(--body);font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer}
.presets button{font-family:var(--mono);font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--c0);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:.85rem;color:var(--muted);line-height:1.6}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>√nの長方形</h1>
    <p class="lead">横 √n、縦 1 の長方形から、第6章と同じように正方形を切り取ります。同じ大きさの正方形が何枚取れたかを並べたものが、√n の連分数です。√n は割り切れないので、切り取りは終わりませんが、同じ枚数の並びが繰り返し現れます。下の表は、途中で止めた長方形から読む近似分数です。</p>
  </header>
  <div class="presets" id="presets"></div>
  <div class="box">
    <canvas id="cv" width="1200" height="560" aria-label="√nの長方形"></canvas>
    <div class="cf" id="cf"></div>
    <p class="note">枚数の並びは整数だけの漸化式で出しています。長方形の絵は、その並びを描いたものです（作図だけ小数を使っています）。</p>
  </div>
  <div class="box">
    <div class="scroll"><table id="tbl"></table></div>
  </div>
  <div class="controls"><button id="play" class="on">停止</button><button id="one">一段</button><button id="again">最初から</button></div>
</div>

<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const isqrt = n => { let k = 0n, odd = 1n; while (n >= odd) { n -= odd; odd += 2n; k++; } return k; };   // 奇数を引けるだけ引く
  // √n の連分数（整数の漸化式）。n = 'phi' は φ = [1; 1, 1, …]
  function cf(n, T) { if (n === 'phi') return Array(T).fill(1n);
    const N = BigInt(n), a0 = isqrt(N), out = [a0]; let m = 0n, d = 1n, a = a0;
    for (let i = 1; i < T; i++) { m = d * a - m; d = (N - m * m) / d; a = (a0 + m) / d; out.push(a); } return out; }
  function conv(a) { const out = []; let p0 = 1n, p1 = a[0], q0 = 0n, q1 = 1n; out.push([p1, q1]);
    for (let i = 1; i < a.length; i++) { [p0, p1] = [p1, a[i] * p1 + p0]; [q0, q1] = [q1, a[i] * q1 + q0]; out.push([p1, q1]); } return out; }
  const PRE = [['phi', 'φ'], [2, '√2'], [3, '√3'], [5, '√5'], [7, '√7'], [13, '√13']];
  const T = 12;
  let n = 'phi', A = [], CV = [], level = 0;
  const cv = document.getElementById('cv'), g = cv.getContext('2d');

  function draw() {
    const ink = css('--ink'), muted = css('--muted'), rule = css('--rule'), cell = css('--cell'), glow = css('--glow');
    const cols = [css('--c0'), css('--c1'), css('--c2')];
    g.clearRect(0, 0, cv.width, cv.height);
    const x = n === 'phi' ? (1 + Math.sqrt(5)) / 2 : Math.sqrt(n);     // 作図だけ
    const pad = 24, sc = Math.min((cv.width - 2 * pad) / x, (cv.height - 2 * pad) / 1), ox = (cv.width - x * sc) / 2, oy = (cv.height - sc) / 2;
    g.fillStyle = cell; g.fillRect(ox, oy, x * sc, sc); g.strokeStyle = rule; g.lineWidth = 2; g.strokeRect(ox, oy, x * sc, sc);
    let rx = 0, ry = 0, w = x, h = 1;
    for (let k = 0; k < level && k < A.length; k++) { const cnt = Number(A[k]);
      for (let j = 0; j < cnt; j++) { const s = Math.min(w, h);
        const last = k === level - 1;
        g.fillStyle = cols[k % 3]; g.globalAlpha = last ? 0.85 : 0.5; g.fillRect(ox + rx * sc, oy + ry * sc, s * sc, s * sc); g.globalAlpha = 1;
        g.strokeStyle = last ? glow : css('--bg'); g.lineWidth = last ? 5 : 1.5; g.strokeRect(ox + rx * sc, oy + ry * sc, s * sc, s * sc);
        if (w >= h) { rx += s; w -= s; } else { ry += s; h -= s; } } }
    document.getElementById('cf').innerHTML = `${n === 'phi' ? 'φ' : '√' + n} = [` + A.map((v, i) => `<span class="${i === level - 1 ? 'now' : i >= level ? 'k' : ''}">${v}</span>`).map((s, i) => i === 0 ? s + ';' : s).join(' ') + ' …]';
    let h2 = `<tr><th>段</th><th>近似分数 p / q</th><th>${n === 'phi' ? 'p² − pq − q²' : 'p² − ' + n + ' q²'}</th></tr>`;
    CV.slice(0, Math.max(1, level)).forEach(([p, q], i) => { const v = n === 'phi' ? p * p - p * q - q * q : p * p - BigInt(n) * q * q;
      h2 += `<tr class="${v === 1n || v === -1n ? 'one' : ''}"><td>${i}</td><td>${p} / ${q}</td><td>${v > 0n ? '+' + v : v}</td></tr>`; });
    document.getElementById('tbl').innerHTML = h2;
  }
  function setN(v) { n = v; A = cf(v, T); CV = conv(A); level = 0;
    document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.n === String(v))); draw(); }
  PRE.forEach(([v, t]) => { const b = document.createElement('button'); b.dataset.n = String(v); b.textContent = t; b.onclick = () => { setN(v); setPlay(true); }; document.getElementById('presets').append(b); });

  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, acc = 0, last = performance.now(), hold = 0, pi = 0;
  const playBtn = document.getElementById('play');
  const setPlay = v => { playing = v; playBtn.textContent = v ? '停止' : '再生'; playBtn.classList.toggle('on', v); };
  playBtn.onclick = () => setPlay(!playing);
  document.getElementById('one').onclick = () => { setPlay(false); level = level >= 9 ? 0 : level + 1; draw(); };
  document.getElementById('again').onclick = () => { level = 0; draw(); };
  setN('phi'); level = 9; draw(); setPlay(playing);
  function loop(t) { const dt = (t - last) / 1000; last = t;
    if (playing) { if (level >= 9) { hold += dt; if (hold > 3) { hold = 0; pi = (pi + 1) % PRE.length; setN(PRE[pi][0]); } }
      else { acc += dt * 1.3; if (acc >= 1) { acc = 0; level++; draw(); } } }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
