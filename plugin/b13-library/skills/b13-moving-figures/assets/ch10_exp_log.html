<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>複利と二乗の対数</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 上：複利の階段（自分の 1/n を足すことを n 回）が e に近づく。下：1〜2 の目盛りの上で二乗し、2 を越えたら半分にして桁 1 を書く */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --ink:#1d2622; --muted:#5d6a63; --rule:#c9d0ca;
  --pos:#1f5fa8; --neg:#b0452a; --glow:#f0c53a; --cell:#ffffff;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --rule:#34403a;
  --pos:#6fa8ec; --neg:#ec8a6c; --glow:#f0c53a; --cell:#232c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --rule:#34403a;
  --pos:#6fa8ec; --neg:#ec8a6c; --glow:#f0c53a; --cell:#232c27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0}
.lead,.note{margin:0;color:var(--muted);line-height:1.7;max-width:66ch}
.note{font-size:.9rem}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
canvas{width:100%;height:auto;max-width:100%}
.read{font-family:var(--mono);font-size:1.15rem;font-weight:600;word-break:break-all}
.read small{display:block;font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--muted)}
.bits{font-family:var(--mono);font-size:1.05rem;letter-spacing:.08em;word-break:break-all}
.bits b{background:var(--glow);color:#1d2622;border-radius:3px;padding:0 2px}
.controls,.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-family:var(--body);font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer}
.presets button{font-family:var(--mono);font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>複利と二乗の対数</h1>
    <p class="lead">指数は、自分の一部を自分に足し続けることです。対数は、二乗を続けて 2 を何回越えたかを数えることです。どちらも整数（1 を 10³⁰ とする目盛り）の足し算と、倍々の梯子による割り算だけで動いています。</p>
  </header>

  <section class="box" aria-label="複利">
    <h2>e を複利で：自分の 1/n を足すことを n 回</h2>
    <canvas id="cvA" width="1200" height="420"></canvas>
    <div class="read" id="readA"></div>
    <div class="presets" id="preA"></div>
  </section>

  <section class="box" aria-label="二乗の対数">
    <h2>2 を底とする対数：二乗して、2 を越えたら半分にして桁 1</h2>
    <canvas id="cvB" width="1200" height="300"></canvas>
    <div class="bits" id="bits"></div>
    <div class="read" id="readB"></div>
    <div class="presets" id="preB"></div>
    <p class="note">目盛りの上の点 x を二乗します。2 を越えたら半分にして 1 を、越えなければ 0 を書きます。書いた桁を 1/2, 1/4, 1/8, … として足したものが log₂ x の小数部分です。</p>
  </section>
  <div class="controls"><button id="play" class="on">停止</button></div>
</div>

<script>
(() => {
  const S = 10n ** 30n;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // 倍々の梯子で割る（第6章）
  const ldiv = (a, m) => { const lad = [[m, 1n]]; while (lad[lad.length-1][0] * 2n <= a) { const [s, k] = lad[lad.length-1]; lad.push([s + s, k + k]); }
    let q = 0n; for (let i = lad.length - 1; i >= 0; i--) { if (a >= lad[i][0]) { a -= lad[i][0]; q += lad[i][1]; } } return q; };
  const show = (x, p = 20) => { const w = x / S, f = (x - w * S).toString().padStart(30, '0').slice(0, p); return `${w}.${f}`; };   // 観察者側の読み
  const toF = x => Number(x * 1000000n / S) / 1e6;                                                                     // 作図だけ
  const E = (() => { let t = S, s = S, k = 1n; while (t) { t = ldiv(t, k); s += t; k++; } return s; })();

  // ---- 複利
  const NS = [1, 2, 4, 12, 30, 100, 365, 3120];
  let n = 12, stepsA = [], kA = 0;
  function planA() { stepsA = [S]; let x = S; for (let i = 0; i < n; i++) { x += ldiv(x, BigInt(n)); stepsA.push(x); } kA = 0; }
  const cA = document.getElementById('cvA'), gA = cA.getContext('2d');
  function drawA() {
    const ink = css('--ink'), muted = css('--muted'), rule = css('--rule'), pos = css('--pos'), neg = css('--neg'), glow = css('--glow');
    const W = cA.width, H = cA.height, L = 90, R = 30, T = 24, B = 50, ymin = 1, ymax = 2.9;
    const Y = v => T + (ymax - v) / (ymax - ymin) * (H - T - B), X = i => L + i / n * (W - L - R);
    gA.clearRect(0, 0, W, H);
    gA.font = '500 22px "IBM Plex Mono",monospace'; gA.textAlign = 'right'; gA.textBaseline = 'middle';
    [1, 1.5, 2, 2.5].forEach(v => { gA.strokeStyle = rule; gA.lineWidth = 1; gA.beginPath(); gA.moveTo(L, Y(v)); gA.lineTo(W - R, Y(v)); gA.stroke(); gA.fillStyle = muted; gA.fillText(v.toFixed(1), L - 10, Y(v)); });
    gA.strokeStyle = neg; gA.setLineDash([10, 8]); gA.lineWidth = 2; gA.beginPath(); gA.moveTo(L, Y(toF(E))); gA.lineTo(W - R, Y(toF(E))); gA.stroke(); gA.setLineDash([]);
    gA.fillStyle = neg; gA.textAlign = 'left'; gA.fillText('e', W - R - 20, Y(toF(E)) - 16);
    gA.strokeStyle = pos; gA.lineWidth = n > 200 ? 2 : 3; gA.beginPath();
    for (let i = 0; i <= kA; i++) { const y = Y(toF(stepsA[i])); if (i === 0) gA.moveTo(X(0), y); else { gA.lineTo(X(i), Y(toF(stepsA[i - 1]))); gA.lineTo(X(i), y); } }
    gA.stroke();
    if (n <= 40) for (let i = 0; i <= kA; i++) { gA.fillStyle = pos; gA.beginPath(); gA.arc(X(i), Y(toF(stepsA[i])), 5, 0, 7); gA.fill(); }
    gA.fillStyle = glow; gA.beginPath(); gA.arc(X(kA), Y(toF(stepsA[kA])), 9, 0, 7); gA.fill();
    gA.fillStyle = muted; gA.textAlign = 'center'; gA.fillText(`足した回数（全部で ${n} 回）`, (L + W - R) / 2, H - 18);
    document.getElementById('readA').innerHTML = `${show(stepsA[kA])}<small>${kA} 回足したところ。e = ${show(E)}</small>`;
  }
  NS.forEach(v => { const b = document.createElement('button'); b.textContent = 'n=' + v; b.dataset.n = v; b.onclick = () => { n = v; planA(); markA(); }; document.getElementById('preA').append(b); });
  const markA = () => document.querySelectorAll('#preA button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));

  // ---- 二乗の対数
  const XS = [[3n, 1n, '3'], [5n, 1n, '5'], [13n, 1n, '13'], [3n, 2n, '3/2'], [10n, 1n, '10']];
  let x0 = 3n, q0 = 1n, label = '3', whole = 0, xB = S, bits = [], phase = 0, prev = S;
  function startB(p, q, t) { x0 = p; q0 = q; label = t; let x = ldiv(p * S, q); whole = 0; while (x >= 2n * S) { x = ldiv(x, 2n); whole++; } xB = x; prev = x; bits = []; phase = 0;
    document.querySelectorAll('#preB button').forEach(b => b.classList.toggle('on', b.textContent === t)); }
  function stepB() { if (bits.length >= 40) return; prev = xB; let y = ldiv(xB * xB, S); if (y >= 2n * S) { y = ldiv(y, 2n); bits.push(1); } else bits.push(0); xB = y; }
  const cB = document.getElementById('cvB'), gB = cB.getContext('2d');
  function drawB() {
    const ink = css('--ink'), muted = css('--muted'), rule = css('--rule'), pos = css('--pos'), glow = css('--glow'), neg = css('--neg');
    const W = cB.width, H = cB.height, L = 60, R = 60, X = v => L + (v - 1) / 3 * (W - L - R), y0 = 150;
    gB.clearRect(0, 0, W, H);
    gB.fillStyle = css('--cell'); gB.fillRect(X(1), y0 - 30, X(2) - X(1), 60); gB.strokeStyle = rule; gB.lineWidth = 2; gB.strokeRect(X(1), y0 - 30, X(2) - X(1), 60);
    gB.strokeStyle = muted; gB.beginPath(); gB.moveTo(X(1), y0); gB.lineTo(X(4), y0); gB.stroke();
    gB.font = '500 24px "IBM Plex Mono",monospace'; gB.textAlign = 'center'; gB.fillStyle = muted;
    [1, 2, 3, 4].forEach(v => { gB.beginPath(); gB.moveTo(X(v), y0 - 40); gB.lineTo(X(v), y0 + 40); gB.stroke(); gB.fillText(v, X(v), y0 + 70); });
    gB.fillStyle = neg; gB.fillText('2 を越えたら半分', (X(2) + X(4)) / 2, y0 - 60);
    const a = toF(prev), b = toF(xB), sq = a * a, last = bits[bits.length - 1];
    if (bits.length) { gB.strokeStyle = pos; gB.lineWidth = 3; gB.beginPath(); gB.moveTo(X(a), y0 - 34); gB.quadraticCurveTo((X(a) + X(sq)) / 2, y0 - 120, X(sq), y0 - 34); gB.stroke();
      if (last === 1) { gB.strokeStyle = glow; gB.lineWidth = 4; gB.beginPath(); gB.moveTo(X(sq), y0 + 34); gB.quadraticCurveTo((X(sq) + X(b)) / 2, y0 + 120, X(b), y0 + 34); gB.stroke(); } }
    gB.fillStyle = pos; gB.beginPath(); gB.arc(X(b), y0, 14, 0, 7); gB.fill();
    gB.fillStyle = ink; gB.textAlign = 'left'; gB.font = '600 24px "IBM Plex Mono",monospace'; gB.fillText(`x = ${b.toFixed(6)}`, X(1), 30);
    document.getElementById('bits').innerHTML = `log₂ ${label} = ${whole}.` + bits.map((t, i) => i === bits.length - 1 ? `<b>${t}</b>` : t).join('') + '…（2進）';
    let v = BigInt(whole) * S, h = S; bits.forEach(t => { h = ldiv(h, 2n); if (t) v += h; });
    document.getElementById('readB').innerHTML = `${show(v, 12)}<small>書いた桁を 1/2, 1/4, 1/8, … として足した値（${bits.length} 桁）</small>`;
  }
  XS.forEach(([p, q, t]) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => startB(p, q, t); document.getElementById('preB').append(b); });

  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now(), accA = 0, accB = 0, hA = 0, hB = 0, ia = NS.indexOf(12), ib = 0;
  const playBtn = document.getElementById('play'); const setPlay = v => { playing = v; playBtn.textContent = v ? '停止' : '再生'; playBtn.classList.toggle('on', v); };
  playBtn.onclick = () => setPlay(!playing);
  planA(); kA = n; markA(); startB(3n, 1n, '3'); for (let i = 0; i < 24; i++) stepB(); drawA(); drawB(); setPlay(playing);
  function loop(t) { const dt = (t - last) / 1000; last = t;
    if (playing) {
      if (kA >= n) { hA += dt; if (hA > 2.5) { hA = 0; ia = (ia + 1) % NS.length; n = NS[ia]; planA(); markA(); } }
      else { accA += dt * (n > 100 ? n / 3 : n > 20 ? 12 : 3); while (accA >= 1 && kA < n) { accA -= 1; kA++; } }
      if (bits.length >= 40) { hB += dt; if (hB > 2.5) { hB = 0; ib = (ib + 1) % XS.length; startB(...XS[ib]); } }
      else { accB += dt * 2.5; if (accB >= 1) { accB = 0; stepB(); } }
    }
    drawA(); drawB(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
