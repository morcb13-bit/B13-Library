<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フィボナッチの輪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* m 個の番地の輪。フィボナッチ数を輪の上で足していき、今の番地から次の番地へ弦を引く。0 に着地するたびに色を変える */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --ink:#1d2622; --muted:#5d6a63; --rule:#c9d0ca;
  --c0:#1f5fa8; --c1:#b0452a; --c2:#3d7d4f; --c3:#8a5a9e; --glow:#f0c53a; --cell:#ffffff;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --rule:#34403a;
  --c0:#6fa8ec; --c1:#ec8a6c; --c2:#7cc490; --c3:#c39ad6; --glow:#f0c53a; --cell:#232c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa8a0; --rule:#34403a;
  --c0:#6fa8ec; --c1:#ec8a6c; --c2:#7cc490; --c3:#c39ad6; --glow:#f0c53a; --cell:#232c27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;text-wrap:balance;letter-spacing:.02em}
.lead{margin:4px 0 0;color:var(--muted);line-height:1.7;max-width:64ch}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
canvas{width:100%;max-width:560px;aspect-ratio:1/1;height:auto;justify-self:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.kv span{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.kv b{font-family:var(--mono);font-weight:600;font-size:1.2rem;font-variant-numeric:tabular-nums}
.seq{font-family:var(--mono);font-size:.82rem;line-height:1.7;color:var(--muted);word-break:break-all;max-height:160px;overflow:auto}
.seq .z{color:var(--ink);font-weight:600;background:var(--glow);border-radius:3px;padding:0 3px;color:#1d2622}
.presets{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-family:var(--body);font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;cursor:pointer}
.presets button{font-family:var(--mono);font-weight:600;min-width:46px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--c0);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>フィボナッチの輪</h1>
    <p class="lead">m 個の番地を輪に並べます。0, 1 から始めて、前の二つを足し、m を越えたら m を引きます。今の番地から次の番地へ弦を引き、0 に着地するたびに色を変えます。(0, 1) に戻ったら一周で、その歩数がピサノ周期です。</p>
  </header>
  <div class="main">
    <div class="box"><canvas id="cv" width="1100" height="1100" aria-label="フィボナッチの輪"></canvas></div>
    <div class="box">
      <div class="kv">
        <span>輪の番地の数 m</span><b id="m">13</b>
        <span>歩数</span><b id="n">0</b>
        <span>0 に初めて着地</span><b id="ap">…</b>
        <span>一周（ピサノ周期）</span><b id="pi">…</b>
      </div>
      <div class="seq" id="seq"></div>
      <div class="presets" id="presets"></div>
      <div class="controls"><button id="play" class="on">停止</button><button id="one">一歩</button><button id="again">最初から</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const MS = [5, 8, 10, 11, 13, 29, 31, 89, 144, 233];
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const cv = document.getElementById('cv'), g = cv.getContext('2d'), W = cv.width, C = W / 2, R = W * 0.40;
  let m = 13, seq = [0, 1], blockOf = [0, 0], period = 0, app = 0;
  const pt = k => { const a = -Math.PI / 2 + k / m * Math.PI * 2; return [C + Math.cos(a) * R, C + Math.sin(a) * R]; };

  function step() {
    if (period) return;
    const L = seq.length, a = seq[L - 2], b = seq[L - 1]; let c = a + b; if (c >= m) c += -m;
    seq.push(c); const blk = blockOf[L - 1] + (b === 0 && L - 1 > 0 ? 1 : 0); blockOf.push(blk);
    if (c === 0 && !app) app = L;
    if (b === 0 && c === 1) period = L - 1;
  }
  function draw() {
    const ink = css('--ink'), muted = css('--muted'), rule = css('--rule'), glow = css('--glow'), cell = css('--cell');
    const cols = [css('--c0'), css('--c1'), css('--c2'), css('--c3')];
    g.clearRect(0, 0, W, W);
    g.beginPath(); g.arc(C, C, R, 0, 7); g.strokeStyle = rule; g.lineWidth = 2; g.stroke();
    const showLab = m <= 40;
    for (let k = 0; k < m; k++) { const [x, y] = pt(k); g.beginPath(); g.arc(x, y, m > 100 ? 3 : 7, 0, 7); g.fillStyle = k === 0 ? glow : muted; g.fill();
      if (showLab) { const a = -Math.PI / 2 + k / m * Math.PI * 2; g.fillStyle = muted; g.font = '500 26px "IBM Plex Mono",monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(k, C + Math.cos(a) * (R + 40), C + Math.sin(a) * (R + 40)); } }
    const steps = seq.length - 1;
    g.lineWidth = steps > 300 ? 1.2 : 3;
    for (let i = 1; i < seq.length; i++) { const [x0, y0] = pt(seq[i - 1]), [x1, y1] = pt(seq[i]);
      g.strokeStyle = cols[blockOf[i] % 4]; g.globalAlpha = i === seq.length - 1 ? 1 : 0.6; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
    g.globalAlpha = 1;
    const [cx, cy] = pt(seq[seq.length - 1]); g.strokeStyle = glow; g.lineWidth = 6; g.beginPath(); g.arc(cx, cy, 18, 0, 7); g.stroke();
    g.fillStyle = ink; g.font = '600 92px "IBM Plex Mono",monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(period || seq.length - 1, C, C - 10);
    g.fillStyle = muted; g.font = '400 30px "BIZ UDPGothic",sans-serif'; g.fillText(period ? '歩で一周' : '歩', C, C + 56);
    document.getElementById('m').textContent = m; document.getElementById('n').textContent = seq.length - 1;
    document.getElementById('ap').textContent = app || '…'; document.getElementById('pi').textContent = period || '…';
    const shown = seq.slice(0, 400);
    document.getElementById('seq').innerHTML = shown.map((v, i) => v === 0 && i > 0 ? `<span class="z">0</span>` : v).join(' ') + (seq.length > 400 ? ' …' : '');
  }
  function setM(v) { m = v; seq = [0, 1]; blockOf = [0, 0]; period = 0; app = 0;
    document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', +b.textContent === v)); draw(); }
  const pre = document.getElementById('presets');
  MS.forEach(v => { const b = document.createElement('button'); b.textContent = v; b.onclick = () => { setM(v); setPlay(true); }; pre.append(b); });

  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, acc = 0, last = performance.now(), hold = 0;
  const playBtn = document.getElementById('play');
  const setPlay = p => { playing = p; playBtn.textContent = p ? '停止' : '再生'; playBtn.classList.toggle('on', p); };
  playBtn.onclick = () => setPlay(!playing);
  document.getElementById('one').onclick = () => { setPlay(false); if (period) setM(m); else step(); draw(); };
  document.getElementById('again').onclick = () => setM(m);
  setM(13); while (!period) step(); draw(); setPlay(playing);
  let mi = MS.indexOf(13);
  function loop(t) { const dt = (t - last) / 1000; last = t;
    if (playing) { if (period) { hold += dt; if (hold > 3) { hold = 0; mi = (mi + 1) % MS.length; setM(MS[mi]); } }
      else { const rate = m > 60 ? 60 : 6; acc += dt * rate; let ch = false; while (acc >= 1 && !period) { acc -= 1; step(); ch = true; } if (ch) draw(); } }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
